  }
  .container{

  .panel{
    background:var(--card);

  .tabs{

    cursor:pointer;

    transition:background .15s,color .15s,border-color .15s;
  }
  .tab-btn:hover{

  }
  .tab-btn.active{

    color:var(--text);

  }
  .stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
  }
  .stat-chip{

    border-radius:999px;
    padding:6px 12px;
    font-size:.78rem;
    color:var(--teal-dark);
    font-weight:600;
  }

    overflow-x:auto;
    border-radius:12px;
    border:1px solid var(--line);
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:.85rem;
    background:#fff;

  }
  thead th{

    color:#fff;
    text-align:left;
    padding:10px 10px;
    position:sticky;
    top:0;
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
  }

    font-size:.7rem;
    margin-left:3px;
  }
  tbody td{
    padding:9px 10px;
    border-bottom:1px solid var(--line);

  }

  td.num, th.num{text-align:center;}

  .cat-SC{background:#a04545;}

    color:#a04545;
    display:block;
    margin-top:2px;
    font-weight:600;
  }
  .pager{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:10px 4px 2px;
    flex-wrap:wrap;
    font-size:.85rem;
  }
  .pager button{
    border:1px solid var(--line);
    background:#fff;
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:.85rem;
  }

  .no-results{

  }

  }

  .post-panel.active{ display:block; }
</style>

 / Sportspersons",27],["GSSC02202604570803","Mahadev Subhash Shet","General / Meritorious Sportsmen / Sportspersons",27],["GSSC02202604528035","Pralhad Ramesh Bhekane Ramesh Bhekane","General / Meritorious Sportsmen / Sportspersons",27],["GSSC02202604586572","Nakul Nagraj Narvekar","General / Meritorious Sportsmen / Sportspersons",27],["GSSC02202604547712","Sunil Shankar Gaonkar","General / Ex-Agniveers / Security Guards / Housekeeping Staff",33],["GSSC02202604543516","Sidharth Naik Ramnath Naik","General / Ex-Agniveers / Security Guards / Housekeeping Staff",32],["GSSC02202604553397","Vinayak Shivshangappa Handargal","General / Ex-Agniveers / Security Guards / Housekeeping Staff",30],["GSSC02202604585455","Atmesh Gurunath Parab","General / Ex-Agniveers / Security Guards / Housekeeping Staff",30],["GSSC02202604543213","Vishal Gokuldas Gaunkar","General / Ex-Agniveers / Security Guards / Housekeeping Staff",29],["GSSC02202604583145","Adarsh Rajesh Talwar","General / Ex-Agniveers / Security Guards / Housekeeping Staff",29],["GSSC02202604568536","Ganpat Vijay Raut","General / Ex-Agniveers / Security Guards / Housekeeping Staff",28],["GSSC02202604591277","Dattaram Sahadev Naik","General / Ex-Agniveers / Security Guards / Housekeeping Staff",27],["GSSC02202604550715","Mahesh Bhongu Patil","General / Ex-Agniveers / Security Guards / Housekeeping Staff",27],["GSSC02202604549691","Vishwajit Premanand Naik","General / Ex-Agniveers / Security Guards / Housekeeping Staff",27],["GSSC02202604522179","Aadesh Sharipad Gaonkar","General / Ex-Agniveers / Security Guards / Housekeeping Staff",27]];

// data row per post: [appid, name, category, score]
// category may include a suffix like "General / Meritorious Sportsmen / Sportspersons"

const POSTS = [
  {key:'pc_male', tab:'PC Male', full:'Police Constable (Male)'},
  {key:'pc_armed', tab:'PC Armed Police', full:'Police Constable (Armed Police)'},
  {key:'pc_female', tab:'PC Female', full:'Police Constable (Female)'},
  {key:'warden', tab:'Warden', full:'Warden (Male)'},
  {key:'pc_driver', tab:'PC Driver', full:'Police Constable Driver (Grade-III)'},
  {key:'round_forester', tab:'Round Forester', full:'Round Forester'},
  {key:'rfo', tab:'RFO', full:'Range Forest Officer'},
  {key:'forest_guard', tab:'Forest Guard', full:'Forest Guard'},
  {key:'matron', tab:'Matron', full:'Matron (Female)'},
  {key:'lascar', tab:'Lascar', full:'Lascar (Male)'},
  {key:'platoon', tab:'Platoon Commander', full:'Platoon Commander (Male)'},
  {key:'asst_superintendent', tab:'Asst. Superintendent', full:'Assistant Superintendent (Male)'},
  {key:'escort', tab:'Escort', full:'Escort (Female)'},
  {key:'pc_greaser', tab:'Constable Greaser', full:'Constable (Greaser)'},
];

const DATA_BY_KEY = {
  rfo: DATA_rfo,
  platoon: DATA_platoon,
  round_forester: DATA_round_forester,
  pc_driver: DATA_pc_driver,
  pc_greaser: DATA_pc_greaser,
  forest_guard: DATA_forest_guard,
  asst_superintendent: DATA_asst_superintendent,
  warden: DATA_warden,
  matron: DATA_matron,
  lascar: DATA_lascar,
  escort: DATA_escort,
  pc_armed: DATA_pc_armed,
  pc_female: DATA_pc_female,
  pc_male: DATA_pc_male,
};

const PAGE_SIZE = 50;
const state = {}; // per-post state: currentPage, filtered, sortKey

function baseCategory(cat){
  return cat.split(' / ')[0];
}

function buildTabBar(){
  const tabBar = document.getElementById('tabBar');
  tabBar.innerHTML = POSTS.map((p,i)=>{
    const count = DATA_BY_KEY[p.key].length;
    return '<button class="tab-btn'+(i===0?' active':'')+'" data-key="'+p.key+'">'+p.tab+' <span class="tab-count">('+count.toLocaleString()+')</span></button>';
  }).join('');
  tabBar.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> activatePost(btn.getAttribute('data-key')));
  });
}

function buildPanels(){
  const wrap = document.getElementById('postPanels');
  wrap.innerHTML = POSTS.map((p,i)=>{
    const cats = Array.from(new Set(DATA_BY_KEY[p.key].map(r=>baseCategory(r[2])))).sort();
    const catOptions = cats.map(c=>'<option value="'+c+'">'+c+'</option>').join('');
    return ''+
    '<div class="post-panel'+(i===0?' active':'')+'" id="panel-'+p.key+'">'+
      '<div class="panel">'+
        '<div class="post-title">'+p.full+'</div>'+
        '<div class="post-sub">Eligibility List for Physical Endurance Test (PET) / Physical Standards</div>'+
        '<div class="controls">'+
          '<div class="field">'+
            '<label for="search-'+p.key+'">Search by Name / Application ID</label>'+
            '<input type="text" id="search-'+p.key+'" placeholder="Type a name or application ID...">'+
          '</div>'+
          '<div class="field">'+
            '<label for="cat-'+p.key+'">Category</label>'+
            '<select id="cat-'+p.key+'"><option value="ALL">All Categories</option>'+catOptions+'</select>'+
          '</div>'+
          '<div class="field">'+
            '<label for="sort-'+p.key+'">Sort By</label>'+
            '<select id="sort-'+p.key+'">'+
              '<option value="rank">List Order</option>'+
              '<option value="score">Final Score</option>'+
              '<option value="name">Name (A\u2013Z)</option>'+
            '</select>'+
          '</div>'+
        '</div>'+
        '<div class="stats" id="stats-'+p.key+'"></div>'+
        '<div class="note">Order shown follows the official published list (Unreserved, then ST, OBC, SC, EWS, Ex-Servicemen and Meritorious Sportspersons sections, in descending merit within each). Date, venue and time of PET will be intimated separately.</div>'+
      '</div>'+
      '<div class="panel" style="padding:0;">'+
        '<div class="table-wrap">'+
          '<table>'+
            '<thead><tr>'+
              '<th class="num" style="width:60px;">Sr.</th>'+
              '<th>Application ID</th>'+
              '<th>Candidate Name</th>'+
              '<th>Category</th>'+
              '<th class="num">Final Score</th>'+
            '</tr></thead>'+
            '<tbody id="tbody-'+p.key+'"></tbody>'+
          '</table>'+
        '</div>'+
        '<div id="noresults-'+p.key+'" class="no-results" style="display:none;">No matching candidates found.</div>'+
        '<div class="pager">'+
          '<button id="prev-'+p.key+'">&larr; Prev</button>'+
          '<span id="pageinfo-'+p.key+'">Page 1</span>'+
          '<button id="next-'+p.key+'">Next &rarr;</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function computeStats(key){
  const data = DATA_BY_KEY[key];
  const counts = {};
  data.forEach(r=>{
    const c = baseCategory(r[2]);
    counts[c] = (counts[c]||0)+1;
  });
  let html = '<span class="stat-chip">Total Candidates: '+data.length.toLocaleString()+'</span>';
  Object.keys(counts).sort().forEach(c=>{
    html += '<span class="stat-chip">'+c+': '+counts[c].toLocaleString()+'</span>';
  });
  document.getElementById('stats-'+key).innerHTML = html;
}

function applyFilters(key){
  const s = state[key];
  const q = document.getElementById('search-'+key).value.trim().toLowerCase();
  const cat = document.getElementById('cat-'+key).value;
  const data = DATA_BY_KEY[key];

  s.filtered = data.map((r, idx)=> ({r, idx})).filter(({r})=>{
    if(cat !== 'ALL' && baseCategory(r[2]) !== cat) return false;
    if(q){
      const name = r[1].toLowerCase();
      const appid = r[0].toLowerCase();
      if(!name.includes(q) && !appid.includes(q)) return false;
    }
    return true;
  });

  sortFiltered(key);
  s.currentPage = 1;
  render(key);
}

function sortFiltered(key){
  const s = state[key];
  const sortKey = document.getElementById('sort-'+key).value;
  if(sortKey === 'rank'){
    s.filtered.sort((a,b)=> a.idx - b.idx);
  } else if(sortKey === 'score'){
    s.filtered.sort((a,b)=> b.r[3]-a.r[3] || a.idx-b.idx);
  } else if(sortKey === 'name'){
    s.filtered.sort((a,b)=> a.r[1].localeCompare(b.r[1]));
  }
}

function render(key){
  const s = state[key];
  const tbody = document.getElementById('tbody-'+key);
  const noResults = document.getElementById('noresults-'+key);
  const pageInfo = document.getElementById('pageinfo-'+key);
  const prevBtn = document.getElementById('prev-'+key);
  const nextBtn = document.getElementById('next-'+key);

  const totalPages = Math.max(1, Math.ceil(s.filtered.length / PAGE_SIZE));
  if(s.currentPage > totalPages) s.currentPage = totalPages;
  const startIdx = (s.currentPage-1)*PAGE_SIZE;
  const pageRows = s.filtered.slice(startIdx, startIdx+PAGE_SIZE);

  if(pageRows.length === 0){
    tbody.innerHTML = '';
    noResults.style.display = 'block';
  } else {
    noResults.style.display = 'none';
    tbody.innerHTML = pageRows.map(({r, idx})=>{
      const [appid, name, category, score] = r;
      const base = baseCategory(category);
      const suffix = category.includes(' / ') ? category.split(' / ').slice(1).join(' / ') : '';
      return '<tr>'+
        '<td class="num"><span class="rank-pill">'+(idx+1)+'</span></td>'+
        '<td>'+appid+'</td>'+
        '<td>'+name+(suffix ? '<span class="merit-tag">'+suffix+'</span>' : '')+'</td>'+
        '<td><span class="cat-badge cat-'+base+'">'+base+'</span></td>'+
        '<td class="num"><strong>'+score+'</strong></td>'+
      '</tr>';
    }).join('');
  }

  pageInfo.textContent = 'Page '+s.currentPage+' of '+totalPages+'  ('+s.filtered.length.toLocaleString()+' results)';
  prevBtn.disabled = s.currentPage <= 1;
  nextBtn.disabled = s.currentPage >= totalPages;
}

function wirePost(key){
  state[key] = {currentPage:1, filtered: DATA_BY_KEY[key].map((r,idx)=>({r,idx}))};
  computeStats(key);

  const searchBox = document.getElementById('search-'+key);
  const catFilter = document.getElementById('cat-'+key);
  const sortSel = document.getElementById('sort-'+key);
  const prevBtn = document.getElementById('prev-'+key);
  const nextBtn = document.getElementById('next-'+key);

  let debounceTimer;
  searchBox.addEventListener('input', ()=>{
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(()=>applyFilters(key), 180);
  });
  catFilter.addEventListener('change', ()=>applyFilters(key));
  sortSel.addEventListener('change', ()=>applyFilters(key));
  prevBtn.addEventListener('click', ()=>{
    if(state[key].currentPage>1){ state[key].currentPage--; render(key); }
  });
  nextBtn.addEventListener('click', ()=>{
    const totalPages = Math.max(1, Math.ceil(state[key].filtered.length / PAGE_SIZE));
    if(state[key].currentPage<totalPages){ state[key].currentPage++; render(key); }
  });

  applyFilters(key);
}

let wired = new Set();

function activatePost(key){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-key')===key);
  });
  document.querySelectorAll('.post-panel').forEach(p=>{
    p.classList.toggle('active', p.id === 'panel-'+key);
  });
  if(!wired.has(key)){
    wirePost(key);
    wired.add(key);
  }
}

buildTabBar();
buildPanels();
activatePost(POSTS[0].key);
</script>
