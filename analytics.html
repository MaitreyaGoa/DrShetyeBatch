<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Analytics – Excel Bicholim Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{--navy:#0b1f66;--g:#166534;--g2:#2fb457;--ink:#1d1d1f;--mut:#6e6e73;--line:#e5e7eb;--bg:#f5f5f7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .hdr{background:var(--navy);color:#fff;position:sticky;top:0;z-index:10}
  .hdr-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .hdr img{width:34px;height:34px;border-radius:8px}
  .hdr h1{font-size:16px;margin:0;flex:1}
  .hdr small{display:block;font-weight:500;opacity:.75;font-size:11px}
  .hdr .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
  main{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h2 .tag{font-size:11px;font-weight:600;color:var(--mut);background:#f1f5f9;border-radius:999px;padding:2px 8px}
  .sec-title{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:22px 4px 10px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px;color:var(--navy)}
  .kpi .l{font-size:12px;color:var(--mut);font-weight:600}
  .kpi .s{font-size:11px;color:var(--g);font-weight:600;margin-top:2px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid rgba(0,0,0,.14);background:#fff;color:var(--ink);font:600 13px Inter,sans-serif;cursor:pointer;text-decoration:none}
  .btn.pri{background:var(--g);border-color:var(--g);color:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 8px;border-bottom:1px solid #f0f1f3;white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);cursor:pointer;user-select:none;position:sticky;top:0;background:#fff}
  td.num,th.num{text-align:right}
  td.t{white-space:normal;min-width:180px}
  .scroll{overflow:auto;max-height:520px;border:1px solid #f0f1f3;border-radius:10px}
  .bar-row{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
  .bar{height:12px;background:#f1f5f9;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy);border-radius:6px}
  .bar-row b{text-align:right}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tools input,.tools select{padding:7px 10px;border:1px solid #d1d5db;border-radius:8px;font:500 13px Inter,sans-serif}
  .tools input{flex:1;min-width:160px}
  .muted{color:var(--mut);font-size:12px}
  .gate{max-width:420px;margin:40px auto;text-align:center}
  .gate input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:500 15px Inter,sans-serif;margin:10px 0}
  .err{color:#b91c1c;font-weight:600;font-size:13px;margin-top:8px}
  .prog{height:6px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--g2);width:0;transition:width .2s}
  .chart svg{display:block;width:100%;height:auto}
  .note{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:10px;padding:10px 12px;font-size:13px}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-in">
  <img src="/icons/icon-192.png" alt=""/>
  <h1>Excel Bicholim — Analytics<small>Users, tests and attempts summary</small></h1>
  <button class="btn" id="refresh" style="display:none">↻ Refresh</button>
  <a class="btn" href="index.html">← Site</a>
</div></header>

<main id="app">
  <div class="card gate">
    <h2 style="justify-content:center">Admin access</h2>
    <p class="muted">Enter the admin password (same as the ⚙ Admin button).</p>
    <input type="password" id="pw" placeholder="Admin password"/>
    <button class="btn pri" id="go" style="width:100%;justify-content:center">Open analytics</button>
    <div class="err" id="pwErr"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>var REQUIRE_GOOGLE_LOGIN = false;</script>
<script src="auth.js"></script>
<script>
(function () {
  "use strict";
  // Google accounts allowed to see signed-in user data (must match firestore.rules)
  var ADMIN_EMAILS = ["maitreyahhh@gmail.com"];

  var $ = function (id) { return document.getElementById(id); };
  var app = $("app");
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var fmtN = function (n) { return Number(n || 0).toLocaleString("en-IN"); };
  var DAY = 864e5;

  // ── catalogue from config.js ──
  var CATS = [
    ["GSSC / Police Mocks", window.GSSC_TESTS], ["GPSC / JSO", window.GPSC_TESTS], ["Monthly Tests", window.MONTHLY_TESTS],
    ["Previous Year Papers", window.PYQ_TESTS], ["Part Tests", window.PART_TESTS], ["Topic Tests", window.TOPIC_TESTS],
    ["Core Subject Tests", window.SPECIAL_TESTS], ["School Level", window.SCHOLARSHIP_TESTS], ["CAT Preparation", window.CAT_TESTS]
  ];
  var TESTS = [], seen = {};
  CATS.forEach(function (c) {
    (c[1] || []).forEach(function (t) {
      if (!t || !t.id || seen[t.id]) return;
      seen[t.id] = 1;
      TESTS.push({ id: t.id, title: t.title || t.id, cat: c[0], live: !!t.live, marks: t.totalMarks || 0 });
    });
  });
  var byId = {}; TESTS.forEach(function (t) { byId[t.id] = t; });

  // ── gate (same password as homepage Admin) ──
  function tryOpen() {
    if ($("pw").value === window.ADMIN_PASSWORD) { try { sessionStorage.setItem("eb-an", "1"); } catch (e) {} start(); }
    else $("pwErr").textContent = "Wrong password";
  }
  $("go").onclick = tryOpen;
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") tryOpen(); });
  try { if (sessionStorage.getItem("eb-an") === "1") start(); } catch (e) {}

  // ── dates in the Sheet come as ISO or "21/11/2026, 7:05:12 pm" ──
  function parseTs(v) {
    if (!v) return 0;
    if (typeof v === "number") return v;
    var s = String(v).trim();
    var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:,?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([ap]\.?m\.?)?)?/i);
    if (m) {
      var h = +(m[4] || 0), ap = (m[7] || "").toLowerCase();
      if (ap.indexOf("p") === 0 && h < 12) h += 12;
      if (ap.indexOf("a") === 0 && h === 12) h = 0;
      return new Date(+m[3], +m[2] - 1, +m[1], h, +(m[5] || 0), +(m[6] || 0)).getTime();
    }
    var t = Date.parse(s);
    return isNaN(t) ? 0 : t;
  }
  function normName(n) { return String(n || "").toLowerCase().replace(/[^a-z\s]/g, "").replace(/\s+/g, " ").trim(); }
  function isJunk(n) { var x = normName(n); return !x || x.length < 2 || /^(test|abc|xyz|asd|qwe|aaa|sample|demo)\b/.test(x); }

  var rows = [], fsUsers = [], fsAttempts = [], fsState = "idle";

  function start() {
    $("refresh").style.display = "";
    $("refresh").onclick = function () { loadSheets(); loadFirestore(); };
    app.innerHTML =
      '<div class="sec-title">Tests on the website</div><div id="catalog"></div>' +
      '<div class="sec-title">All test attempts (Google Sheet · everyone, incl. before login)</div>' +
      '<div id="sheets"><div class="card"><b>Loading results from Google Sheets…</b><div class="prog"><i id="pg"></i></div><div class="muted" id="pgTxt"></div></div></div>' +
      '<div class="sec-title">Signed-in students (Google login)</div><div id="fs"></div>';
    renderCatalog();
    loadSheets();
    window.ExcelAuth && ExcelAuth.onChange(function () { loadFirestore(); });
  }

  // ── 1. catalogue ──
  function renderCatalog() {
    var live = TESTS.filter(function (t) { return t.live; });
    var cats = {};
    TESTS.forEach(function (t) { cats[t.cat] = cats[t.cat] || { all: 0, live: 0 }; cats[t.cat].all++; if (t.live) cats[t.cat].live++; });
    var max = Math.max.apply(null, Object.keys(cats).map(function (k) { return cats[k].live; }).concat([1]));
    $("catalog").innerHTML =
      '<div class="kpis">' + kpi(live.length, "Live tests available") + kpi(TESTS.length - live.length, "Not live / upcoming") +
      kpi(Object.keys(cats).length, "Categories") + kpi(fmtN(live.reduce(function (a, t) { return a + (t.marks || 0); }, 0)), "Total marks of live tests") + "</div>" +
      '<div class="card"><h2>Live tests by category</h2>' +
      Object.keys(cats).map(function (k) {
        return '<div class="bar-row"><span>' + esc(k) + '</span><div class="bar"><i style="width:' + (cats[k].live / max * 100) + '%"></i></div><b>' + cats[k].live + "</b></div>";
      }).join("") + "</div>";
  }
  function kpi(v, l, s) { return '<div class="kpi"><div class="v">' + v + '</div><div class="l">' + l + "</div>" + (s ? '<div class="s">' + s + "</div>" : "") + "</div>"; }

  // ── 2. Google Sheets (all attempts) ──
  function loadSheets() {
    if (!window.SCRIPT_URL) { $("sheets").innerHTML = '<div class="card note">SCRIPT_URL missing in config.js.</div>'; return; }
    var ids = TESTS.filter(function (t) { return t.live; }).map(function (t) { return t.id; });
    var done = 0, out = [], i = 0, LIMIT = 6;
    rows = [];
    function next() {
      if (i >= ids.length) return Promise.resolve();
      var id = ids[i++];
      return fetch(SCRIPT_URL + "?action=read&testId=" + encodeURIComponent(id))
        .then(function (r) { return r.json(); })
        .then(function (res) { (res.data || []).forEach(function (r) { r._test = id; out.push(r); }); })
        .catch(function () {})
        .then(function () {
          done++;
          var pg = $("pg"); if (pg) pg.style.width = (done / ids.length * 100) + "%";
          var t = $("pgTxt"); if (t) t.textContent = done + " / " + ids.length + " tests checked · " + out.length + " attempts found";
          return next();
        });
    }
    var workers = []; for (var w = 0; w < LIMIT; w++) workers.push(next());
    Promise.all(workers).then(function () { rows = out; renderSheets(); });
  }

  function renderSheets() {
    var now = Date.now();
    var valid = rows.filter(function (r) { return !isJunk(r.name); });
    valid.forEach(function (r) {
      r._ts = parseTs(r.timestamp); r._n = normName(r.name);
      var t = byId[r._test]; var tot = parseFloat(r.total) || 0;
      var pct = parseFloat(String(r.percent || "").replace("%", ""));
      r._pct = isNaN(pct) ? (t && t.marks ? tot / t.marks * 100 : 0) : pct;
    });
    var students = {};
    valid.forEach(function (r) {
      var s = students[r._n] = students[r._n] || { name: String(r.name).trim(), n: 0, tests: {}, pctSum: 0, best: 0, last: 0 };
      s.n++; s.tests[r._test] = 1; s.pctSum += r._pct; s.best = Math.max(s.best, r._pct); s.last = Math.max(s.last, r._ts);
    });
    var stuList = Object.keys(students).map(function (k) { var s = students[k]; s.uniq = Object.keys(s.tests).length; s.avg = s.pctSum / s.n; return s; });
    var inDays = function (d) { return valid.filter(function (r) { return r._ts && now - r._ts <= d * DAY; }); };
    var uniqIn = function (list) { var o = {}; list.forEach(function (r) { o[r._n] = 1; }); return Object.keys(o).length; };
    var w7 = inDays(7), d30 = inDays(30), today = valid.filter(function (r) { return r._ts && new Date(r._ts).toDateString() === new Date().toDateString(); });
    var avgPct = valid.length ? valid.reduce(function (a, r) { return a + r._pct; }, 0) / valid.length : 0;

    // per test
    var per = {};
    valid.forEach(function (r) {
      var p = per[r._test] = per[r._test] || { id: r._test, n: 0, names: {}, pct: 0, top: 0, last: 0 };
      p.n++; p.names[r._n] = 1; p.pct += r._pct; p.top = Math.max(p.top, parseFloat(r.total) || 0); p.last = Math.max(p.last, r._ts);
    });
    var perList = TESTS.filter(function (t) { return t.live; }).map(function (t) {
      var p = per[t.id] || { n: 0, names: {}, pct: 0, top: 0, last: 0 };
      return { id: t.id, title: t.title, cat: t.cat, marks: t.marks, n: p.n, uniq: Object.keys(p.names).length, avg: p.n ? p.pct / p.n : 0, top: p.top, last: p.last };
    });
    var attempted = perList.filter(function (p) { return p.n > 0; }).length;

    // daily chart (30 days)
    var days = []; for (var d = 29; d >= 0; d--) { var dt = new Date(now - d * DAY); days.push({ key: dt.toDateString(), label: dt.getDate() + "/" + (dt.getMonth() + 1), n: 0, u: {} }); }
    var dmap = {}; days.forEach(function (x) { dmap[x.key] = x; });
    valid.forEach(function (r) { if (!r._ts) return; var x = dmap[new Date(r._ts).toDateString()]; if (x) { x.n++; x.u[r._n] = 1; } });

    // category
    var cat = {};
    perList.forEach(function (p) { cat[p.cat] = (cat[p.cat] || 0) + p.n; });
    var catMax = Math.max.apply(null, Object.keys(cat).map(function (k) { return cat[k]; }).concat([1]));

    $("sheets").innerHTML =
      '<div class="kpis">' +
        kpi(fmtN(stuList.length), "Unique students", "by name") + kpi(fmtN(valid.length), "Total test attempts") +
        kpi(fmtN(uniqIn(w7)), "Active students (7 days)", fmtN(w7.length) + " attempts") + kpi(fmtN(uniqIn(d30)), "Active students (30 days)", fmtN(d30.length) + " attempts") +
        kpi(fmtN(today.length), "Attempts today", uniqIn(today) + " students") + kpi(attempted + " / " + perList.length, "Live tests attempted at least once") +
        kpi(Math.round(avgPct) + "%", "Average score") + kpi(stuList.length ? (valid.length / stuList.length).toFixed(1) : 0, "Tests per student (avg)") +
      "</div>" +
      '<div class="card chart"><h2>Daily attempts — last 30 days <span class="tag">bars = attempts · line = unique students</span></h2>' + dailyChart(days) + "</div>" +
      '<div class="grid2">' +
        '<div class="card"><h2>Attempts by category</h2>' + Object.keys(cat).sort(function (a, b) { return cat[b] - cat[a]; }).map(function (k) {
          return '<div class="bar-row"><span>' + esc(k) + '</span><div class="bar"><i style="width:' + (cat[k] / catMax * 100) + '%;background:#2fb457"></i></div><b>' + fmtN(cat[k]) + "</b></div>";
        }).join("") + "</div>" +
        '<div class="card"><h2>Score bands</h2>' + bands(valid) + "</div>" +
      "</div>" +
      '<div class="card"><h2>Tests <span class="tag">' + perList.length + ' live</span> <button class="btn" id="csvT" style="margin-left:auto">⬇ CSV</button></h2>' +
        '<div class="tools"><input id="tq" placeholder="Search test…"/><select id="tf"><option value="">All</option><option value="0">Never attempted</option><option value="1">Attempted</option></select></div>' +
        '<div class="scroll"><table id="tt"></table></div></div>' +
      '<div class="card"><h2>Students <span class="tag">' + stuList.length + '</span> <button class="btn" id="csvS" style="margin-left:auto">⬇ CSV</button></h2>' +
        '<div class="tools"><input id="sq" placeholder="Search student…"/></div>' +
        '<div class="scroll"><table id="st"></table></div>' +
        '<p class="muted">Students are matched by the name they typed, so the same person with different spellings counts twice. Google login (below) fixes this going forward.</p></div>';

    table("tt", perList, [
      ["Test", "title", "t"], ["Category", "cat"], ["Attempts", "n", "num"], ["Students", "uniq", "num"],
      ["Avg %", function (p) { return p.n ? Math.round(p.avg) + "%" : "—"; }, "num", "avg"], ["Top", function (p) { return p.n ? p.top + "/" + p.marks : "—"; }, "num", "top"],
      ["Last attempt", function (p) { return p.last ? new Date(p.last).toLocaleDateString("en-IN") : "—"; }, "", "last"]
    ], "n", function (p) {
      var q = ($("tq").value || "").toLowerCase(), f = $("tf").value;
      return (!q || p.title.toLowerCase().indexOf(q) >= 0) && (f === "" || (f === "0" ? p.n === 0 : p.n > 0));
    });
    $("tq").oninput = $("tf").onchange = function () { table.redraw("tt"); };
    table("st", stuList, [
      ["Student", "name", "t"], ["Attempts", "n", "num"], ["Different tests", "uniq", "num"],
      ["Avg %", function (s) { return Math.round(s.avg) + "%"; }, "num", "avg"], ["Best %", function (s) { return Math.round(s.best) + "%"; }, "num", "best"],
      ["Last active", function (s) { return s.last ? new Date(s.last).toLocaleDateString("en-IN") : "—"; }, "", "last"]
    ], "n", function (s) { var q = ($("sq").value || "").toLowerCase(); return !q || s.name.toLowerCase().indexOf(q) >= 0; });
    $("sq").oninput = function () { table.redraw("st"); };
    $("csvT").onclick = function () { csv("excelbicholim-tests.csv", ["Test", "Category", "Attempts", "Students", "Avg %", "Top", "Out of", "Last attempt"],
      perList.map(function (p) { return [p.title, p.cat, p.n, p.uniq, Math.round(p.avg), p.top, p.marks, p.last ? new Date(p.last).toLocaleDateString("en-IN") : ""]; })); };
    $("csvS").onclick = function () { csv("excelbicholim-students.csv", ["Student", "Attempts", "Different tests", "Avg %", "Best %", "Last active"],
      stuList.map(function (s) { return [s.name, s.n, s.uniq, Math.round(s.avg), Math.round(s.best), s.last ? new Date(s.last).toLocaleDateString("en-IN") : ""]; })); };
  }

  function bands(list) {
    var b = [["80–100%", 80, 101, "#15803d"], ["60–79%", 60, 80, "#0d9488"], ["40–59%", 40, 60, "#d97706"], ["Below 40%", -999, 40, "#dc2626"]];
    var tot = list.length || 1;
    return b.map(function (x) {
      var n = list.filter(function (r) { return r._pct >= x[1] && r._pct < x[2]; }).length;
      return '<div class="bar-row"><span>' + x[0] + '</span><div class="bar"><i style="width:' + (n / tot * 100) + "%;background:" + x[3] + '"></i></div><b>' + Math.round(n / tot * 100) + "%</b></div>";
    }).join("") + '<p class="muted">Share of all attempts in each score range.</p>';
  }

  function dailyChart(days) {
    var W = 720, H = 200, L = 30, R = 8, T = 10, B = 24, w = W - L - R, h = H - T - B;
    var max = Math.max.apply(null, days.map(function (d) { return d.n; }).concat([4]));
    var bw = w / days.length;
    var y = function (v) { return T + h - v / max * h; };
    var out = "";
    [0, .5, 1].forEach(function (f) { var v = Math.round(max * f); out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#eef0f3"/><text x="' + (L - 4) + '" y="' + (y(v) + 4) + '" font-size="10" text-anchor="end" fill="#9ca3af">' + v + "</text>"; });
    days.forEach(function (d, i) {
      var x = L + i * bw + 2;
      out += '<rect x="' + x.toFixed(1) + '" y="' + y(d.n).toFixed(1) + '" width="' + (bw - 4).toFixed(1) + '" height="' + (T + h - y(d.n)).toFixed(1) + '" rx="3" fill="#0b1f66"><title>' + d.label + ": " + d.n + " attempts, " + Object.keys(d.u).length + " students</title></rect>";
      if (i % 5 === 0 || i === days.length - 1) out += '<text x="' + (x + bw / 2 - 2).toFixed(1) + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" fill="#9ca3af">' + d.label + "</text>";
    });
    var path = days.map(function (d, i) { return (i ? "L" : "M") + (L + i * bw + bw / 2).toFixed(1) + " " + y(Object.keys(d.u).length).toFixed(1); }).join(" ");
    out += '<path d="' + path + '" fill="none" stroke="#2fb457" stroke-width="2.5" stroke-linejoin="round"/>';
    return '<svg viewBox="0 0 ' + W + " " + H + '">' + out + "</svg>";
  }

  // sortable table helper
  var TBL = {};
  function table(id, data, cols, sortKey, filter) { TBL[id] = { data: data, cols: cols, key: sortKey, dir: -1, filter: filter }; table.redraw(id); }
  table.redraw = function (id) {
    var t = TBL[id], el = $(id); if (!t || !el) return;
    var list = t.data.filter(t.filter).slice().sort(function (a, b) {
      var x = a[t.key], y = b[t.key];
      if (typeof x === "string" || typeof y === "string") return t.dir * String(x || "").localeCompare(String(y || ""));
      return t.dir * ((x || 0) - (y || 0));
    });
    el.innerHTML = "<thead><tr>" + t.cols.map(function (c, i) {
      var k = c[3] || (typeof c[1] === "string" ? c[1] : "");
      return '<th class="' + (c[2] || "") + '" data-k="' + k + '">' + c[0] + (t.key === k ? (t.dir === 1 ? " ▲" : " ▼") : "") + "</th>";
    }).join("") + "</tr></thead><tbody>" + list.map(function (r) {
      return "<tr>" + t.cols.map(function (c) { var v = typeof c[1] === "function" ? c[1](r) : r[c[1]]; return '<td class="' + (c[2] || "") + '">' + esc(typeof v === "number" ? fmtN(v) : v) + "</td>"; }).join("") + "</tr>";
    }).join("") + "</tbody>";
    Array.prototype.forEach.call(el.querySelectorAll("th"), function (th) {
      th.onclick = function () { var k = th.getAttribute("data-k"); if (!k) return; if (t.key === k) t.dir = -t.dir; else { t.key = k; t.dir = -1; } table.redraw(id); };
    });
  };

  function csv(name, head, body) {
    var q = function (v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var text = "﻿" + [head].concat(body).map(function (r) { return r.map(q).join(","); }).join("\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = name; a.click();
  }

  // ── 3. Firestore (signed-in students) ──
  function loadFirestore() {
    var box = $("fs"); if (!box) return;
    var A = window.ExcelAuth;
    if (!A || !A.ok) { box.innerHTML = '<div class="card note">Firebase could not load.</div>'; return; }
    if (!A.ready) { box.innerHTML = '<div class="card">Checking Google sign-in…</div>'; return; }
    var u = A.user;
    if (!u || ADMIN_EMAILS.indexOf((u.email || "").toLowerCase()) < 0) {
      box.innerHTML = '<div class="card"><p style="margin-top:0">Sign in with the <b>admin Google account</b> to see registered students' +
        (u ? ' (signed in as ' + esc(u.email) + ' — not an admin account. <button class="btn" id="so">Switch</button>)' : "") + ".</p><div id=\"gb\" style=\"max-width:320px\"></div></div>";
      if (!u) $("gb").appendChild(A.googleButton("Sign in as admin"));
      else $("so").onclick = function () { A.signOut(); };
      return;
    }
    if (fsState === "loading") return;
    fsState = "loading";
    box.innerHTML = '<div class="card">Loading registered students…</div>';
    var db = firebase.firestore();
    Promise.all([db.collection("users").get(), db.collectionGroup("attempts").get()]).then(function (res) {
      fsUsers = []; res[0].forEach(function (d) { var x = d.data(); x.uid = d.id; fsUsers.push(x); });
      fsAttempts = []; res[1].forEach(function (d) { var x = d.data(); x.uid = d.ref.parent.parent.id; fsAttempts.push(x); });
      fsState = "done"; renderFirestore();
    }).catch(function (e) {
      fsState = "idle";
      box.innerHTML = '<div class="card note"><b>Could not read student accounts</b> (' + esc(e.code || e.message) + ").<br>Make sure the latest <b>firestore.rules</b> (with the admin section) is published in Firebase → Firestore → Rules.</div>";
    });
  }

  function ms(v) { return v && v.toMillis ? v.toMillis() : (typeof v === "number" ? v : 0); }
  function renderFirestore() {
    var now = Date.now();
    var users = fsUsers.map(function (x) { x._c = ms(x.createdAt); x._l = ms(x.lastLoginAt); return x; });
    var per = {}; fsAttempts.forEach(function (a) { var p = per[a.uid] = per[a.uid] || { n: 0, last: 0, pct: 0 }; p.n++; p.last = Math.max(p.last, a.clientTime || 0); p.pct += a.pct || 0; });
    users.forEach(function (x) { var p = per[x.uid] || { n: 0, last: 0, pct: 0 }; x._n = p.n; x._last = p.last; x._avg = p.n ? p.pct / p.n : 0; });
    var newIn = function (d) { return users.filter(function (x) { return x._c && now - x._c <= d * DAY; }).length; };
    var activeIn = function (d) { var o = {}; fsAttempts.forEach(function (a) { if (now - (a.clientTime || 0) <= d * DAY) o[a.uid] = 1; }); return Object.keys(o).length; };
    var withAtt = users.filter(function (x) { return x._n > 0; }).length;

    // signups chart (30 days)
    var days = []; for (var d = 29; d >= 0; d--) { var dt = new Date(now - d * DAY); days.push({ key: dt.toDateString(), label: dt.getDate() + "/" + (dt.getMonth() + 1), n: 0, u: {} }); }
    var dm = {}; days.forEach(function (x) { dm[x.key] = x; });
    users.forEach(function (x) { var k = x._c && dm[new Date(x._c).toDateString()]; if (k) k.n++; });
    fsAttempts.forEach(function (a) { var k = a.clientTime && dm[new Date(a.clientTime).toDateString()]; if (k) k.u[a.uid] = 1; });

    $("fs").innerHTML =
      '<div class="kpis">' + kpi(fmtN(users.length), "Registered students") + kpi(fmtN(newIn(7)), "New sign-ups (7 days)", newIn(1) + " today") +
        kpi(fmtN(activeIn(7)), "Active (7 days)", activeIn(1) + " today") + kpi(fmtN(fsAttempts.length), "Attempts by signed-in students", withAtt + " students took a test") + "</div>" +
      '<div class="card chart"><h2>Sign-ups per day — last 30 days <span class="tag">bars = new students · line = active students</span></h2>' + dailyChart(days) + "</div>" +
      '<div class="card"><h2>Registered students <span class="tag">' + users.length + '</span> <button class="btn" id="csvU" style="margin-left:auto">⬇ CSV</button></h2>' +
        '<div class="tools"><input id="uq" placeholder="Search name or email…"/></div><div class="scroll"><table id="ut"></table></div></div>';
    table("ut", users, [
      ["Name", "name", "t"], ["Email", "email"], ["Tests", "_n", "num"], ["Avg %", function (x) { return x._n ? Math.round(x._avg) + "%" : "—"; }, "num", "_avg"],
      ["Joined", function (x) { return x._c ? new Date(x._c).toLocaleDateString("en-IN") : "—"; }, "", "_c"],
      ["Last test", function (x) { return x._last ? new Date(x._last).toLocaleDateString("en-IN") : "—"; }, "", "_last"]
    ], "_c", function (x) { var q = ($("uq").value || "").toLowerCase(); return !q || (String(x.name) + " " + String(x.email)).toLowerCase().indexOf(q) >= 0; });
    $("uq").oninput = function () { table.redraw("ut"); };
    $("csvU").onclick = function () { csv("excelbicholim-registered.csv", ["Name", "Email", "Tests", "Avg %", "Joined", "Last test"],
      users.map(function (x) { return [x.name, x.email, x._n, Math.round(x._avg), x._c ? new Date(x._c).toLocaleDateString("en-IN") : "", x._last ? new Date(x._last).toLocaleDateString("en-IN") : ""]; })); };
  }
})();
</script>
